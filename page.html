<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君兰中学信息科</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            background: #1e293b;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo h1 {
            color: #38bdf8;
            font-size: 1.3rem;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .message-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .message-btn.active {
            background: #22c55e;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .user-info {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .username {
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        /* 主要内容区 */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ========== 主页样式 ========== */
        .home-page {
            display: block;
        }

        .home-page.hide {
            display: none;
        }

        .welcome-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            margin-bottom: 32px;
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .welcome-card h2 {
            color: #e2e8f0;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .welcome-card p {
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .info-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            border: 1px solid #334155;
        }

        .info-icon {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .info-card h3 {
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .info-card p {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        /* ========== 消息界面（表格）样式 ========== */
        .message-page {
            display: none;
        }

        .message-page.show {
            display: block;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            color: #e2e8f0;
            margin-bottom: 16px;
            font-size: 1.2rem;
        }

        .add-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 1;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
        }

        .add-form input:focus {
            border-color: #3b82f6;
        }

        .add-form button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-form button:hover {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0f172a;
            color: #38bdf8;
        }

        td {
            color: #cbd5e6;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
        }

        .back-home-btn {
            background: #64748b;
            margin-bottom: 16px;
        }

        .back-home-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="logo">
            <h1>🏫 君兰中学信息科</h1>
        </div>
        <div class="nav-buttons">
            <div class="user-info">
                <span>👤</span>
                <span class="username" id="displayUsername"></span>
            </div>
            <button class="message-btn" id="messageBtn" onclick="showMessagePage()">
                📩 消息
            </button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="main-content">
        <!-- ========== 主页（默认显示） ========== -->
        <div id="homePage" class="home-page">
            <div class="welcome-card">
                <div class="welcome-icon">🏫</div>
                <h2>欢迎回来，<span id="welcomeUsername"></span>！</h2>
                <p>君兰中学信息科管理系统</p>
                <button class="message-btn" onclick="showMessagePage()" style="margin-top: 16px;">
                    📩 进入消息中心
                </button>
            </div>

            <div class="info-cards">
                <div class="info-card">
                    <div class="info-icon">📝</div>
                    <h3>消息管理</h3>
                    <p>查看和发布通知消息</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📊</div>
                    <h3>数据统计</h3>
                    <p>查看系统使用情况</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚙️</div>
                    <h3>系统设置</h3>
                    <p>个性化配置选项</p>
                </div>
            </div>
        </div>

        <!-- ========== 消息界面（表格管理，默认隐藏） ========== -->
        <div id="messagePage" class="message-page">
            <div class="card">
                <button class="message-btn back-home-btn" onclick="showHomePage()" style="background:#64748b;">
                    ← 返回主页
                </button>
            </div>

            <div class="card">
                <h2>➕ 添加消息</h2>
                <div class="add-form">
                    <input type="text" id="textContent" placeholder="请输入内容" autocomplete="off">
                    <button onclick="addText()">添加</button>
                </div>
            </div>

            <div class="card">
                <h2>📋 消息列表</h2>
                <div id="tableContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://energetic-presence-production.up.railway.app/api/texts';
        let currentUsername = '';

        // 获取URL参数中的用户名
        function getUsernameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            if (username) {
                currentUsername = username;
                localStorage.setItem('username', username);
                document.getElementById('displayUsername').textContent = username;
                document.getElementById('welcomeUsername').textContent = username;
            } else {
                const savedUsername = localStorage.getItem('username');
                if (savedUsername) {
                    currentUsername = savedUsername;
                    document.getElementById('displayUsername').textContent = savedUsername;
                    document.getElementById('welcomeUsername').textContent = savedUsername;
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // 显示主页（默认状态）
        function showHomePage() {
            document.getElementById('homePage').classList.remove('hide');
            document.getElementById('messagePage').classList.remove('show');
            // 更新按钮样式
            const msgBtn = document.getElementById('messageBtn');
            msgBtn.classList.remove('active');
        }

        // 显示消息页面（表格界面）
        function showMessagePage() {
            document.getElementById('homePage').classList.add('hide');
            document.getElementById('messagePage').classList.add('show');
            // 更新按钮样式
            const msgBtn = document.getElementById('messageBtn');
            msgBtn.classList.add('active');
            // 刷新数据
            loadData();
        }

        // 加载表格数据
        async function loadData() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                if (result.success && result.data.length > 0) {
                    let tableHtml = `<tr><thead> hilab<th>ID</th><th>内容</th><th>创建人</th><th>操作</th></thead><tbody>`;
                    result.data.forEach(item => {
                        tableHtml += `<tr>
                            <td>${item.id}</td>
                            <td>${escapeHtml(item.content)}</td>
                            <td>${escapeHtml(item.username)}</td>
                            <td><button class="delete-btn" onclick="deleteText(${item.id})">删除</button></td>
                        </tr>`;
                    });
                    tableHtml += `</tbody></table>`;
                    container.innerHTML = tableHtml;
                } else {
                    container.innerHTML = '<div class="loading">暂无数据，请添加</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="loading">加载失败: ' + error.message + '</div>';
            }
        }

        // 添加数据
        async function addText() {
            const content = document.getElementById('textContent').value;
            if (!content.trim()) {
                alert('请输入内容');
                return;
            }
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, username: currentUsername })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('textContent').value = '';
                    loadData();
                } else {
                    alert('添加失败: ' + result.error);
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        // 删除数据
        async function deleteText(id) {
            if (!confirm('确定要删除这条数据吗？')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    loadData();
                } else {
                    alert('删除失败: ' + result.error);
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        }

        // 防止XSS攻击
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 页面初始化：默认显示主页
        getUsernameFromURL();
        showHomePage();
    </script>
</body>
</html>
